[package]
name = "proxmox-mcp"
version = "0.15.0"
edition = "2024"
rust-version = "1.88"
description = "A read-only MCP server that exposes Proxmox VE data as tools for Claude and other MCP clients"
license = "GPL-3.0-only"
repository = "https://github.com/3kirt/proxmox-mcp"
keywords = ["proxmox", "mcp", "model-context-protocol", "rmcp"]
categories = ["command-line-utilities", "api-bindings"]

[[bin]]
name = "proxmox-mcp"
path = "src/main.rs"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

# Unfixable: the transitive dependency tree carries duplicate crate versions
# (e.g. windows-sys 0.52 vs 0.61 via reqwest/tokio).
multiple_crate_versions = "allow"
# Doc comments are prose-heavy and reference many proper nouns and API terms
# (Proxmox, QEMU, LXC, RFC 3986, TLS, …); backticking them all is noise.
doc_markdown = "allow"
# `use rmcp::model::*` is an intentional glob over rmcp's large model module.
wildcard_imports = "allow"

[dependencies]
rpassword = "7"
percent-encoding = "2"
rmcp = { version = "3.9", features = [
    "server",
    "macros",
    "transport-io",
] }
tokio = { version = "1", features = ["full"] }
futures = { version = "0.3", default-features = false, features = ["std"] }
# rustls with the ring provider, not reqwest's default aws-lc-rs: aws-lc-sys
# carries OpenSSL-style license terms that are a poor fit for GPL-3.0-only
# (cargo-deny bans it). main/ProxmoxClient install ring as the process default.
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1.0"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
# tests/launch_path.rs: a local HTTPS stand-in for Proxmox (the server
# refuses plain HTTP, so wiremock can't sit behind a cluster file).
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }

[profile.release]
lto = true
opt-level = "z"
codegen-units = 1
strip = true
