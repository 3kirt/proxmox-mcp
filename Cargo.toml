[package]
name = "proxmox-mcp"
version = "0.10.0"
edition = "2024"
description = "A read-only MCP server that exposes Proxmox VE data as tools for Claude and other MCP clients"
license = "GPL-3.0"
repository = "https://github.com/3kirt/proxmox-mcp"
keywords = ["proxmox", "mcp", "model-context-protocol", "rmcp"]
categories = ["command-line-utilities", "api-bindings"]

[[bin]]
name = "proxmox-mcp"
path = "src/main.rs"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

# Unfixable: the transitive dependency tree carries duplicate crate versions
# (e.g. windows-sys 0.52 vs 0.61 via reqwest/tokio).
multiple_crate_versions = "allow"
# Doc comments are prose-heavy and reference many proper nouns and API terms
# (Proxmox, QEMU, LXC, RFC 3986, TLS, …); backticking them all is noise.
doc_markdown = "allow"
# `use rmcp::model::*` is an intentional glob over rmcp's large model module.
wildcard_imports = "allow"
# The `Config` fields deliberately share a `file_` prefix to mark them as the
# file-derived layer (vs. the env overrides applied in `resolve`).
struct_field_names = "allow"

[dependencies]
rmcp = { version = "3.1", features = [
    "server",
    "macros",
    "transport-io",
] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1.0"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
url = "2"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"

[profile.release]
lto = true
opt-level = "z"
codegen-units = 1
strip = true
