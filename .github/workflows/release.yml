name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Tag matches the Cargo.toml and plugin.json versions
        run: |
          version=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} != Cargo.toml version ${version}"; exit 1
          fi
          # The plugin's launcher downloads the release matching this version.
          plugin=$(jq -r .version plugin/.claude-plugin/plugin.json)
          if [ "${GITHUB_REF_NAME}" != "v${plugin}" ]; then
            echo "tag ${GITHUB_REF_NAME} != plugin.json version ${plugin}"; exit 1
          fi
      - name: Tag commit is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: CHANGELOG has a section for this version
        run: scripts/changelog-section.sh "${GITHUB_REF_NAME#v}" > /dev/null

  checks:
    name: Checks
    needs: verify
    uses: ./.github/workflows/ci.yml

  build:
    name: Build ${{ matrix.artifact }}
    needs: checks
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Built on 22.04 so the binary runs on glibc 2.35+.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: proxmox-mcp-linux-amd64
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: proxmox-mcp-linux-arm64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: proxmox-mcp-darwin-arm64
          # Cross-compiled on Apple silicon; smoke-tested under Rosetta.
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: proxmox-mcp-darwin-amd64
            rosetta: true
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain and target
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Install Rosetta
        if: matrix.rosetta
        run: softwareupdate --install-rosetta --agree-to-license
      - name: Smoke test
        run: make smoke BIN=target/${{ matrix.target }}/release/proxmox-mcp
      - name: Stage binary
        run: cp target/${{ matrix.target }}/release/proxmox-mcp ${{ matrix.artifact }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  publish:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: cd artifacts && sha256sum proxmox-mcp-* > checksums.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/proxmox-mcp-*
      - name: Release notes from CHANGELOG
        run: scripts/changelog-section.sh "${GITHUB_REF_NAME#v}" > release-notes.md
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: artifacts/*
          body_path: release-notes.md
          fail_on_unmatched_files: true
